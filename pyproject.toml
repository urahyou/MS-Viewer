[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radio-msviewer"
version = "0.2.1"
license = {text = "GPL-3.0-only"}
description = "Read-only Qt viewer for radio astronomy Measurement Sets"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "python-casacore>=3.6", "PyQt6>=6.6", "pyqtgraph>=0.13.7", "astropy>=6"]

[project.optional-dependencies]
macos = ["pyinstaller>=6.11,<7"]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.9"]

[project.scripts]
msviewer = "msviewer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyqt6"

[tool.ruff]
line-length = 100

[tool.setuptools.package-data]
msviewer = ["sample_catalog.json"]
