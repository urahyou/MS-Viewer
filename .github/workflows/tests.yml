name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Dependencies
        run: python -m pip install -e '.[dev]'
      - name: Public examples
        run: python -m msviewer.datasets --all
      - name: Synthetic example
        run: python -m msviewer --demo --inspect
      - name: Tests and lint
        run: |
          python -m pytest -q
          python -m ruff check src tests scripts packaging
          python -m ruff format --check src tests scripts packaging
